[project]
name = "datacurrent-collector"
version = "0.1.0"
description = "DataCurrent scheduled telemetry collector"
requires-python = ">=3.12"
dependencies = [
  "datacurrent-api",
  "celery[redis]>=5.4,<6",
  "redis>=5.2,<7",
  "structlog>=24,<26"
]

[tool.uv.sources]
datacurrent-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]
