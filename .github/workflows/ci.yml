name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run ruff format --check apps/api workers/collector
      - run: uv run ruff check apps/api workers/collector
      - run: uv run pytest apps/api/tests -q

  web:
    name: Web quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @datacurrent/web lint
      - run: pnpm --filter @datacurrent/web typecheck
      - run: pnpm --filter @datacurrent/web test
      - run: pnpm --filter @datacurrent/web build

  product-tour:
    name: Product tour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @datacurrent/web exec playwright install --with-deps chromium
      - run: pnpm --filter @datacurrent/web test:e2e

