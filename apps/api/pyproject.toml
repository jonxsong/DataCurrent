[project]
name = "datacurrent-api"
version = "0.1.0"
description = "DataCurrent database intelligence API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=25,<27",
  "celery[redis]>=5.4,<6",
  "cryptography>=44,<51",
  "fastapi>=0.115,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "openai-agents>=0.2,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "redis>=5.2,<7",
  "snowflake-connector-python>=3.12,<5",
  "sqlalchemy[asyncio]>=2.0,<3",
  "sqlglot>=26,<30",
  "structlog>=24,<26",
  "uvicorn[standard]>=0.34,<1"
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "testcontainers[postgres]>=4.9,<5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datacurrent"]
