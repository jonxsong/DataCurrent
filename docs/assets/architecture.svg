<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">DataCurrent system architecture</title>
  <desc id="desc">A professional hand-drawn architecture diagram showing browser, API, metadata services, worker, PostgreSQL and Snowflake sources, Redis, OpenAI, and evidence flows.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1c282b" stroke-width="1" opacity=".35"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 L3,6 Z" fill="#42e5c2"/>
    </marker>
    <marker id="arrowMuted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 L3,6 Z" fill="#718186"/>
    </marker>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#f3f7f6;letter-spacing:-1px}.subtitle{font:500 14px Inter,Arial,sans-serif;fill:#829297}.label{font:700 16px Inter,Arial,sans-serif;fill:#eff5f3}.small{font:500 12px Inter,Arial,sans-serif;fill:#91a19f}.tiny{font:600 10px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#42e5c2;letter-spacing:1px}.box{fill:#11191b;stroke:#526165;stroke-width:2}.rough{fill:none;stroke:#718186;stroke-width:1;opacity:.55}.accent{stroke:#42e5c2}.edge{fill:none;stroke:#42e5c2;stroke-width:2.3;marker-end:url(#arrow)}.edge2{fill:none;stroke:#718186;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrowMuted)}
    </style>
  </defs>
  <rect width="1400" height="900" rx="22" fill="#090e10"/>
  <rect width="1400" height="900" rx="22" fill="url(#grid)"/>

  <text x="64" y="68" class="title">DataCurrent · Evidence-first database intelligence</text>
  <text x="64" y="94" class="subtitle">Production architecture · read-only collection · isolated verification · bounded AI reasoning</text>
